<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schedule OCR with Google Document AI</title>
<link href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet">
<style>
body { font-family:sans-serif; margin:20px; display:flex; gap:30px; }
#left { width:45%; }
#right { flex:1; }
img { max-width:100%; border:1px solid #ccc; }
table { border-collapse:collapse; width:100%; }
td,th { border:1px solid #999; padding:5px; min-width:60px; }
button { margin-top:10px; padding:6px 12px; }
</style>
</head>
<body>
<div id="left">
  <h3>1. Upload and crop</h3>
  <input type="file" id="fileInput" accept="image/*"><br><br>
  <img id="image">
  <button id="processBtn" disabled>Process with Document AI</button>
  <div id="status"></div>
</div>

<div id="right">
  <h3>2. OCR result</h3>
  <div id="preview"></div>
  <div id="table"></div>
  <button id="saveBtn" style="display:none;">Save Table</button>
  <div id="saveStatus"></div>
</div>

<script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
<script>
let cropper;

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.getElementById('image');
  img.src = URL.createObjectURL(file);
  img.onload = () => {
    if (cropper) cropper.destroy();
    cropper = new Cropper(img, { aspectRatio: NaN });
    document.getElementById('processBtn').disabled = false;
  };
});

document.getElementById('processBtn').onclick = async () => {
  document.getElementById('status').textContent = 'Processing...';
  const canvas = cropper.getCroppedCanvas({ maxWidth:3000, maxHeight:3000 });
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const base64 = await blobToBase64(blob);

  const res = await fetch('process.php', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ image: base64 })
  });
  const data = await res.json();

  document.getElementById('status').textContent = '';
  document.getElementById('preview').innerHTML = `<h4>Cropped + Enhanced</h4><img src="${data.image}">`;
  document.getElementById('table').innerHTML = data.tableHtml || '<p>No table detected.</p>';
  document.getElementById('saveBtn').style.display = data.tableHtml ? 'inline-block' : 'none';
};

document.getElementById('saveBtn').onclick = async () => {
  const html = document.querySelector('#table table').outerHTML;
  const res = await fetch('save_table.php', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ html })
  });
  const msg = await res.text();
  document.getElementById('saveStatus').textContent = msg;
};

function blobToBase64(blob) {
  return new Promise(r=>{
    const reader=new FileReader();
    reader.onloadend=()=>r(reader.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
